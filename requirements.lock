# Pinned production dependencies for reproducible Docker builds.
#
# Captured by resolving pyproject.toml's dependencies in a clean venv:
#   python3 -m venv /tmp/lockvenv && /tmp/lockvenv/bin/pip install .
#   /tmp/lockvenv/bin/pip freeze   # dropping the `tcdd-telegram` self-line
# The Dockerfile installs these first, then the app itself with `--no-deps`, so an
# upstream release can no longer silently change what ships between deploys. CI
# (test.yml) still does a fresh `pip install -e '.[dev]'`, so it doubles as a
# forward-compat canary against newer dependency versions.
#
# Regenerate whenever pyproject.toml's dependency bounds change (resolve in a
# clean venv or read it back off a fresh prod deploy, then repin here).
